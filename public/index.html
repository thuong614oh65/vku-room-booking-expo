<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA & Mobile Web App Manifest & Meta -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VKU Booking" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f172a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Global Early Capture of PWA Install Prompt & Service Worker -->
    <script>
      window.__vkuDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__vkuDeferredPrompt = e;
        console.log('[VKU PWA] beforeinstallprompt captured globally!');
        window.dispatchEvent(new CustomEvent('vku-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__vkuDeferredPrompt = null;
        console.log('[VKU PWA] App installed successfully!');
        window.dispatchEvent(new CustomEvent('vku-app-installed'));
      });

      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isReloading) {
            isReloading = true;
            console.log('[VKU PWA] New Service Worker active, reloading page to apply updates...');
            window.location.reload();
          }
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('[VKU PWA] Service Worker registered with scope:', reg.scope);
            reg.update();
          }).catch(function(err) {
            console.warn('[VKU PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
