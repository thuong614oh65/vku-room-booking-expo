<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA & Mobile Web App Manifest & Meta -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VKU Booking" />

    <!-- Official Google Identity Services (OAuth 2.0 / OpenID Connect) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0f172a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Global Early Capture of PWA Install Prompt & Service Worker -->
    <script>
      window.__vkuDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__vkuDeferredPrompt = e;
        console.log('[VKU PWA] beforeinstallprompt captured globally!');
        window.dispatchEvent(new CustomEvent('vku-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__vkuDeferredPrompt = null;
        console.log('[VKU PWA] App installed successfully!');
        window.dispatchEvent(new CustomEvent('vku-app-installed'));
      });

      if ('serviceWorker' in navigator) {
        var isReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!isReloading) {
            isReloading = true;
            console.log('[VKU PWA] New Service Worker active, reloading page to apply updates...');
            window.location.reload();
          }
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('[VKU PWA] Service Worker registered with scope:', reg.scope);
            reg.update();
          }).catch(function(err) {
            console.warn('[VKU PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>

    <!-- Tự động chuyển hướng từ trình duyệt nhúng Zalo/Messenger sang thẳng Safari (iOS) hoặc Chrome (Android) -->
    <script>
      (function() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var isEmbedded = /Zalo|FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line|MicroMessenger|BytedanceWebview|TikTok|\bwv\b|WebView/i.test(ua) ||
          (isIOS && !/Safari\/|CriOS\/|FxiOS\/|EdgiOS\/|OPiOS\//i.test(ua));

        if (!isEmbedded) return;

        var fullUrl = window.location.href;
        var withoutProtocol = fullUrl.replace(/^https?:\/\//i, '');
        var safariSchemeUrl = 'x-safari-https://' + withoutProtocol;
        var chromeIntentUrl = 'intent://' + withoutProtocol + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(fullUrl) + ';end';
        var targetExternalUrl = isIOS ? safariSchemeUrl : (isAndroid ? chromeIntentUrl : fullUrl);

        window.__vkuOpenExternalBrowser = function() {
          try {
            var a = document.createElement('a');
            a.href = targetExternalUrl;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
              if (a.parentNode) a.parentNode.removeChild(a);
            }, 300);
          } catch (e) {}
          try {
            window.location.href = targetExternalUrl;
          } catch (e2) {}
        };

        window.addEventListener('DOMContentLoaded', function() {
          // 1. Tạo thanh điều hướng nổi (Native HTML <a>) ở trên cùng màn hình Zalo
          var bar = document.createElement('div');
          bar.id = 'vku-zalo-safari-bar';
          bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#0284c7,#1d4ed8);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,0.35);font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
          bar.innerHTML =
            '<div style="flex:1;font-size:12px;line-height:1.35;font-weight:600;">' +
              '🧭 Bạn đang mở trong <b>Zalo</b>. Chuyển sang <b>' + (isIOS ? 'Safari' : 'Chrome') + '</b> để đăng nhập Google @vku.udn.vn:' +
            '</div>' +
            '<a href="' + targetExternalUrl + '" style="background:#ffffff;color:#0284c7;text-decoration:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">' +
              'Mở ' + (isIOS ? 'Safari ↗' : 'Chrome ↗') +
            '</a>';
          document.body.appendChild(bar);

          // 2. Tự động kích hoạt chuyển sang Safari / Chrome ngay khi vừa bấm link trong Zalo
          setTimeout(function() {
            window.__vkuOpenExternalBrowser();
          }, 180);
        });
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
